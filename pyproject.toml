[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esp32-fan-control"
version = "0.1.0"
description = "Autonomous ESP32 smoker temperature controller with dual-actuator blower and servo damper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "krispy71" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
esp32-fan-control = "esp32_fan_control.Controller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/esp32_fan_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
