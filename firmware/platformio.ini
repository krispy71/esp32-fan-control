; PlatformIO Project Configuration File for ESP32 Smoker Controller
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
extra_scripts = pre:tools/patch_ble_client.py
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_RUNNING_CORE=0
    -Wall
lib_deps = 
    ; Built-in framework libraries used: LittleFS, WebServer, WiFi, BLE, SPI, Preferences


[env:native]
platform = native@1.2.1
build_flags = 
    -std=c++17
    -Wall
    -D UNIT_TEST

; Select the wired K-type converter. Food CS is disabled by default (-1).
; Set SMOKER_FOOD_CS=21 in build_flags when a second converter is installed.
[env:esp32dev-max31856]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags}
    -D SMOKER_MAX31856=1
